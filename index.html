<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegioSnack Kasse</title><style>*{box-sizing:border-box}body{margin:0;background:#10141c;color:#f5f6fa;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}h1{margin:0}small{color:#aab4c5}section{background:#1b2330;border:1px solid #303b4b;border-radius:18px;padding:18px;margin:16px 0}label{display:block;color:#b9c3d1;margin:12px 0 5px}input,button,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #465267;background:#111822;color:white;width:100%}button{background:#d32f3f;border:0;font-weight:bold;margin-top:12px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{font-size:27px;font-weight:700;color:#83e5b3}.entry{border-top:1px solid #394353;padding:12px 0}.entry button{width:auto;background:#354154;margin-right:8px;font-size:13px}#msg{color:#83e5b3}h2{font-size:19px;margin-top:0}</style><main><small>REGIOSNACK · TAGESABSCHLUSS</small><h1>Kassenübersicht</h1><section><h2>Abendliche Kassenzählung</h2><form id="f"><label>Datum</label><input id="d" type="date" required><div class="grid"><div><label>Münzen (€)</label><input id="m" inputmode="decimal" placeholder="0,00" required></div><div><label>Scheine (€)</label><input id="s" inputmode="decimal" placeholder="0,00" required></div></div><label>Bank (€)</label><input id="b" inputmode="decimal" placeholder="0,00" required><div class="grid" style="margin-top:20px"><div><small>Gesamt</small><div class="num" id="g"></div></div><div><small>Verbleibende Kasse</small><div class="num" id="r"></div></div></div><button>Eintrag speichern</button><div id="msg" role="status"></div></form></section><section><h2>Übersicht</h2><select id="period"><option value="week">Diese Woche</option><option value="month">Dieser Monat</option><option value="all">Alle Einträge</option></select><p id="summary"></p><div id="history"></div><button id="export">CSV-Sicherung exportieren</button></section><small>Lokale Speicherung im Browser. Kassenzählungen sind keine Umsatzsummen und ersetzen kein gesetzlich erforderliches Kassenbuch.</small></main><script>const $=id=>document.getElementById(id), key='regiosnack-kasse-v1';let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch{};const today=()=>{let t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};$('d').value=today();const cents=x=>Math.round(Number(x.trim().replace(',','.'))*100), eur=x=>(x/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});function calc(){let m=cents($('m').value),s=cents($('s').value),b=cents($('b').value);$('g').textContent=eur(m+s);$('r').textContent=eur(m+s-b)};['m','s','b'].forEach(id=>$(id).oninput=calc);calc();function save(next){try{localStorage.setItem(key,JSON.stringify(next));rows=next;return true}catch{$('msg').textContent='Speicherung fehlgeschlagen.';return false}}$('f').onsubmit=e=>{e.preventDefault();let d=$('d').value,m=cents($('m').value),s=cents($('s').value),b=cents($('b').value);if(![m,s,b].every(x=>Number.isSafeInteger(x)&&x>=0)||b>m+s){$('msg').textContent='Bitte gültige Beträge eingeben. Bank darf Gesamt nicht überschreiten.';return}if(rows.some(x=>x.d===d)&&!confirm('Eintrag für dieses Datum ersetzen?'))return;if(save([...rows.filter(x=>x.d!==d),{d,m,s,b}])){$('msg').textContent='Gespeichert.';render()}};function render(){let now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)),end=new Date(start);end.setDate(end.getDate()+7);let p=$('period').value,a=rows.filter(x=>p==='all'||(p==='month'?x.d.slice(0,7)===today().slice(0,7):new Date(x.d+'T00:00:00')>=start&&new Date(x.d+'T00:00:00')<end)).sort((a,b)=>b.d.localeCompare(a.d));$('summary').textContent=`${a.length} Abschlüsse · Bank gesamt: ${eur(a.reduce((n,x)=>n+x.b,0))}`;$('history').replaceChildren();for(let x of a){let el=document.createElement('div');el.className='entry';let t=document.createElement('div');t.textContent=`${x.d.split('-').reverse().join('.')} · Gesamt ${eur(x.m+x.s)} · Bank ${eur(x.b)} · Kasse ${eur(x.m+x.s-x.b)}`;el.append(t);for(let action of ['Bearbeiten','Löschen']){let btn=document.createElement('button');btn.textContent=action;btn.onclick=()=>{if(action==='Bearbeiten'){$('d').value=x.d;for(let k of ['m','s','b'])$(k).value=(x[k]/100).toFixed(2).replace('.',',');calc();window.scrollTo(0,0)}else if(confirm('Eintrag löschen?')&&save(rows.filter(y=>y.d!==x.d)))render()};el.append(btn)}$('history').append(el)}}$('period').onchange=render;render();$('export').onclick=()=>{let csv='Datum;Münzen;Scheine;Gesamt;Bank;Kasse\n'+rows.map(x=>[x.d,...[x.m,x.s,x.m+x.s,x.b,x.m+x.s-x.b].map(n=>(n/100).toFixed(2).replace('.',','))].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='RegioSnack-Kasse.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
